name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first: nothing here is worth
# finishing once it is already out of date.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libssl-dev zlib1g-dev poppler-utils

      # llama.cpp is fetched and compiled from source; without this every run
      # pays several minutes for a dependency that rarely changes.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # A clean checkout must produce a server that starts. Without any API key
      # or model it should refuse to run and say why, rather than crash.
      - name: Binary runs and reports its usage
        run: |
          ./build/zathas_ai --help
          if ./build/zathas_ai --env /nonexistent.env; then
            echo "Expected a failure when no model or API key is configured" >&2
            exit 1
          fi

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - run: npm ci
        working-directory: frontend-react
      - run: npm run build
        working-directory: frontend-react

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: zathas:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container starts and serves /api/health
        run: |
          docker run -d --name zathas -p 8080:8080 \
            -e GROQ_API_KEY=ci-placeholder-not-a-real-key \
            zathas:ci --skip-checks --host 0.0.0.0 --static-dir /app/frontend
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health; then echo; ok=1; break; fi
            sleep 1
          done
          docker logs zathas
          test "${ok:-0}" = "1"
          docker rm -f zathas
